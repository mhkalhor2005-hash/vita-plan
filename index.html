<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ویتاپلن — ویتامین‌های شخصی‌سازی‌شده در ساشه‌های روزانه">
<link rel="icon" href="assets/logo.png">
<title>ویتاپلن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout concept: a dark lab at night — particles drift, glass panels float over a lime glow, the sachet strip is a neon progress bar */
:root{
  --bg:#05080A; --bg-2:#0A1013;
  --lime:#A6F04A; --lime-ink:#B9F56E; --lime-soft:rgba(166,240,74,.12); --lime-glow:rgba(166,240,74,.45);
  --cream:#05080A; --paper:rgba(255,255,255,.045); --paper-2:rgba(255,255,255,.08);
  --cocoa:#EEF4EA; --cocoa-2:#A9B6AE; --stone:#6E7D76; --line:rgba(255,255,255,.09); --line-2:rgba(166,240,74,.35);
  --rose:#FF5FA2; --indigo:#7C8CFF; --violet:#B48CFF; --cyan:#4FE3E0;
  --warn:#FFB35C; --warn-soft:rgba(255,179,92,.1); --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.1);
  --shadow:0 30px 80px -30px rgba(0,0,0,.9);
  --display:"Vazirmatn","Sora",system-ui,sans-serif;
  --latin:"Sora","Vazirmatn",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --body:"Vazirmatn",Tahoma,system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);
  --mx:50vw; --my:20vh; --vx:50%; --vy:30%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{overflow-x:clip}
body{background:var(--bg);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.8;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#fx{position:fixed;inset:0;z-index:-2;pointer-events:none}
.aura{position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
   radial-gradient(600px circle at var(--mx) var(--my),rgba(166,240,74,.07),transparent 60%),
   radial-gradient(900px 600px at 85% -10%,rgba(166,240,74,.14),transparent 60%),
   radial-gradient(700px 500px at 0% 110%,rgba(124,140,255,.10),transparent 60%),
   var(--bg)}
.grid-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 20%,transparent 75%)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.3;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--lime);color:#071003}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:12px}
.wrap{max-width:1140px;margin:0 auto}
.latin{font-family:var(--latin);direction:ltr;letter-spacing:.02em}
.grad{background:linear-gradient(100deg,#E9FFD0 0%,var(--lime) 45%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));background:rgba(5,8,10,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand img{width:36px;height:36px;filter:drop-shadow(0 0 12px var(--lime-glow))}
.brand b{font-family:var(--display);font-weight:800;font-size:1.2rem}
.brand small{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.22em;color:var(--stone);line-height:1;margin-top:-1px}
.top .sp{flex:1}
.ghost{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:.85rem;color:var(--cocoa-2);transition:border-color .3s,color .3s,box-shadow .3s}
.ghost:hover{border-color:var(--line-2);color:var(--cocoa);box-shadow:0 0 20px -6px var(--lime-glow)}

/* neon sachet strip */
.strip{display:flex;gap:3px;direction:rtl;flex:1;max-width:520px}
.strip i{flex:1;height:8px;border-radius:2px;background:rgba(255,255,255,.07);transition:background .6s var(--ease),box-shadow .6s}
.strip i.on{background:var(--lime);box-shadow:0 0 10px var(--lime-glow)}
.strip i.on:nth-child(4n){background:var(--cyan);box-shadow:0 0 10px rgba(79,227,224,.5)}
.strip-label{font-family:var(--mono);font-size:.72rem;color:var(--stone);white-space:nowrap}

/* views + transitions */
main{padding-block:12px 150px;position:relative}
.view{animation:enter .8s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(22px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.top{view-transition-name:topbar}
::view-transition-group(topbar){animation:none}
::view-transition-old(root){animation:vtOut .7s var(--ease) both}
::view-transition-new(root){animation:vtReveal .9s var(--ease) both}
@keyframes vtOut{to{opacity:0;transform:scale(.96);filter:blur(10px) brightness(.6)}}
@keyframes vtReveal{from{clip-path:circle(0 at var(--vx) var(--vy));filter:brightness(1.8)}to{clip-path:circle(150vmax at var(--vx) var(--vy));filter:none}}
::view-transition-group(cat-ic){animation-duration:.8s;animation-timing-function:var(--ease)}
.cat .ic.morph,.q-ic{view-transition-name:cat-ic}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;border:0;border-radius:999px;padding:15px 28px;background:var(--lime);color:#071003;font-family:var(--display);font-weight:700;font-size:1.02rem;overflow:hidden;
  box-shadow:0 0 0 1px rgba(166,240,74,.6),0 10px 40px -8px var(--lime-glow);transition:transform .3s var(--ease),box-shadow .3s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(120%);transition:transform .9s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--lime),0 16px 60px -6px var(--lime-glow)}
.btn:hover::after{transform:translateX(-120%)}
.btn .arr{width:26px;height:26px;border-radius:50%;background:#071003;color:var(--lime);display:grid;place-items:center;transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(-5px)}
.btn[disabled]{opacity:.35;pointer-events:none;box-shadow:none}
.btn.lime{background:var(--lime)}
.btn.line{background:transparent;color:var(--cocoa);box-shadow:inset 0 0 0 1px var(--line)}
.btn.line .arr{background:var(--paper-2);color:var(--cocoa)}
.meta{font-size:.82rem;color:var(--stone)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:56px 70px;min-height:min(760px,calc(100vh - 70px))}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;color:var(--lime-ink);border:1px solid var(--line-2);background:var(--lime-soft);border-radius:999px;padding:5px 14px 5px 12px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 var(--lime-glow);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px transparent}}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.3rem);font-weight:900;margin:22px 0 18px;line-height:1.18}
.lede{font-size:1.08rem;color:var(--cocoa-2);max-width:32em}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:32px}
.kpis{display:flex;flex-wrap:wrap;gap:28px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.kpi b{display:block;font-family:var(--latin);font-weight:700;font-size:1.7rem;line-height:1.1;color:var(--cocoa)}
.kpi small{color:var(--stone);font-size:.8rem}

/* orbit visual */
.orbit{position:relative;aspect-ratio:1;max-width:520px;width:100%;margin-inline:auto}
.orbit .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(166,240,74,.25);animation:spin 40s linear infinite}
.orbit .ring.r2{inset:9%;border-style:solid;border-color:var(--line);animation-duration:60s;animation-direction:reverse}
.orbit .ring.r2::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 16px var(--lime)}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit .core{position:absolute;inset:18%;border-radius:50%;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 0 120px -10px var(--lime-glow),inset 0 0 60px rgba(0,0,0,.6)}
.orbit .core img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.05)}
.orbit .core::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(166,240,74,.0) 40%,rgba(166,240,74,.55) 50%,rgba(166,240,74,0) 52%,transparent 100%);background-size:100% 220%;animation:scan 3.6s var(--ease) infinite;mix-blend-mode:screen}
@keyframes scan{from{background-position:0 120%}to{background-position:0 -120%}}
.orbit .glow{position:absolute;inset:22%;border-radius:50%;background:var(--lime);filter:blur(80px);opacity:.28;z-index:-1;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45;transform:scale(1.08)}}
.hud{position:absolute;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;font-family:var(--mono);font-size:.7rem;color:var(--cocoa);direction:ltr;white-space:nowrap;animation:float 6s ease-in-out infinite;box-shadow:var(--shadow)}
.hud i{width:8px;height:8px;border-radius:50%;flex:none}
.hud em{font-style:normal;color:var(--lime)}
.hud.h1{top:12%;right:0}
.hud.h2{top:44%;left:0;animation-delay:-2s}
.hud.h3{bottom:12%;right:4%;animation-delay:-4s}
.hud.h4{top:2%;left:14%;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-10px)}}

/* sections */
.band{padding-block:80px;position:relative}
.band h2{font-size:clamp(1.6rem,3.4vw,2.5rem);font-weight:800;margin-bottom:10px}
.band .sub{color:var(--cocoa-2);max-width:40em}
.sec-tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;color:var(--lime);direction:ltr;text-align:right;margin-bottom:12px;display:block}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px;perspective:1200px}
.plan{position:relative;border-radius:28px;padding:12px 12px 22px;overflow:hidden;transition:transform .5s var(--ease),border-color .4s,box-shadow .5s;transform-style:preserve-3d}
.plan:hover{border-color:color-mix(in srgb,var(--pc) 60%,transparent);box-shadow:0 30px 80px -30px color-mix(in srgb,var(--pc) 70%,transparent)}
.plan .ph{border-radius:20px;overflow:hidden;aspect-ratio:4/3.4;max-width:100%;position:relative}
.plan .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease);filter:saturate(.9)}
.plan:hover .ph img{transform:scale(1.07)}
.plan .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(5,8,10,.85))}
.plan .nm{position:absolute;bottom:14px;right:16px;left:16px;z-index:1;display:flex;justify-content:space-between;align-items:end;direction:ltr}
.plan .nm b{font-family:var(--latin);font-weight:700;font-size:1.5rem;color:#fff}
.plan .nm span{font-family:var(--mono);font-size:.65rem;letter-spacing:.15em;color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 50%,transparent);border-radius:999px;padding:2px 10px}
.plan p{margin:14px 8px 0;color:var(--cocoa-2);font-size:.92rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px;position:relative}
.steps::before{content:"";position:absolute;top:27px;right:28px;left:28px;height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)}
.step{position:relative;padding:0 4px}
.step .nd{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:var(--latin);font-weight:700;color:var(--lime);margin-bottom:18px;position:relative;z-index:1;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 0 30px -8px var(--lime-glow)}
.step h3{font-size:1.08rem;font-weight:700;margin-bottom:6px}
.step p{font-size:.9rem;color:var(--cocoa-2)}
.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.line{border-radius:24px;padding:26px}
.line .k{font-family:var(--latin);font-weight:700;direction:ltr;text-align:right;font-size:1.3rem}
.line p{font-size:.92rem;color:var(--cocoa-2);margin-top:8px}
.line.hl{border-color:var(--line-2);background:linear-gradient(160deg,rgba(166,240,74,.16),rgba(166,240,74,.03));box-shadow:0 0 60px -20px var(--lime-glow)}
.line.hl .k{color:var(--lime)}
.cta-band{border-radius:36px;padding:56px 32px;text-align:center;position:relative;overflow:hidden;margin-top:30px}
.cta-band::before{content:"";position:absolute;inset:-40% 20% auto;height:120%;background:radial-gradient(closest-side,var(--lime-glow),transparent);opacity:.5;z-index:-1}
.cta-band h2{font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:800}
.cta-band .cta-row{justify-content:center}
.foot{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;padding-block:30px;border-top:1px solid var(--line);color:var(--stone);font-size:.82rem;margin-top:60px}
.reveal.pre{opacity:0;transform:translateY(46px) scale(.98)}
.reveal.pre.in{opacity:1;transform:none;transition:opacity .9s var(--ease) var(--rd,0ms),transform 1s var(--ease) var(--rd,0ms)}

/* quiz */
.qwrap{max-width:740px;margin:0 auto;padding-top:28px}
.qpanel{border-radius:32px;padding:32px;box-shadow:var(--shadow)}
.kicker{font-size:.82rem;color:var(--lime-ink);font-weight:500;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kicker .code{font-family:var(--mono);direction:ltr;color:var(--stone);font-size:.7rem;border:1px solid var(--line);border-radius:6px;padding:0 7px}
.qtitle{font-size:clamp(1.35rem,3.2vw,1.95rem);font-weight:800;margin:10px 0 6px}
.qhint{color:var(--stone);font-size:.9rem}
.opts{display:grid;gap:10px;margin-top:24px}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:right;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 18px;font-size:1rem;transition:border-color .25s,background .25s,transform .25s var(--ease),box-shadow .3s;overflow:hidden}
.opt::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--ox,50%) var(--oy,50%),rgba(166,240,74,.12),transparent 50%);opacity:0;transition:opacity .3s}
.opt:hover{border-color:rgba(255,255,255,.2);transform:translateX(-4px)}
.opt:hover::before{opacity:1}
.opt .mk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--stone);flex:none;display:grid;place-items:center;transition:all .3s var(--ease);position:relative}
.opts.multi .opt .mk{border-radius:7px}
.opt.sel{border-color:var(--line-2);background:var(--lime-soft);box-shadow:0 0 0 1px rgba(166,240,74,.25),0 10px 40px -15px var(--lime-glow)}
.opt.sel .mk{border-color:var(--lime);background:var(--lime);box-shadow:0 0 14px var(--lime-glow)}
.opt.sel .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#071003}
.opts.multi .opt.sel .mk::after{width:10px;height:6px;border-radius:0;background:none;border:solid #071003;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.opt.pop{animation:pop .4s var(--ease)}
@keyframes pop{40%{transform:scale(.97)}}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:.85rem;color:var(--cocoa-2)}
.inp{width:100%;font:inherit;color:var(--cocoa);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:13px 16px;transition:border-color .25s,box-shadow .25s}
.inp:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 4px var(--lime-soft)}
.inp::placeholder{color:var(--stone)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.why{margin-top:18px;border-radius:16px;background:rgba(79,227,224,.06);border:1px solid rgba(79,227,224,.18)}
.why summary{cursor:pointer;list-style:none;padding:11px 16px;font-size:.88rem;color:var(--cyan);font-weight:500;display:flex;gap:10px;align-items:center}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"i";width:20px;height:20px;border-radius:50%;border:1px solid var(--cyan);display:grid;place-items:center;font-family:var(--mono);font-size:.72rem}
.why p{padding:0 16px 14px;font-size:.9rem;color:var(--cocoa-2)}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px}
.back{background:none;border:0;color:var(--stone);display:inline-flex;gap:6px;align-items:center;padding:8px 4px;transition:color .2s}
.back:hover{color:var(--cocoa)}
.err{color:var(--bad);font-size:.88rem;margin-top:10px;min-height:1.4em}
.qcard{animation:qIn .6s var(--ease) both}
.qcard.rev{animation-name:qInRev}
@keyframes qIn{from{opacity:0;transform:translateX(-50px);filter:blur(6px)}}
@keyframes qInRev{from{opacity:0;transform:translateX(50px);filter:blur(6px)}}
.q-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--lime);color:#071003;margin-bottom:16px;box-shadow:0 0 40px -6px var(--lime-glow)}
.q-ic svg{width:28px;height:28px}

/* hub */
.hubhead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-top:28px}
.hubhead h1{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:800}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:30px}
.cat{position:relative;aspect-ratio:1;max-width:100%;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:28px;padding:44px 18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;isolation:isolate;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .5s var(--ease),border-color .3s,box-shadow .5s;animation:catIn .8s var(--ease) both}
@keyframes catIn{from{opacity:0;transform:translateY(30px) scale(.92);filter:blur(6px)}}
.cat::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--ox,50%) var(--oy,50%),rgba(166,240,74,.16),transparent 60%);opacity:0;transition:opacity .4s;z-index:-1}
.cat:hover{transform:translateY(-6px);border-color:var(--line-2);box-shadow:0 30px 70px -30px var(--lime-glow)}
.cat:hover::before{opacity:1}
.cat .ic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--cocoa);margin-bottom:10px;transition:transform .6s var(--ease),background .3s,color .3s,box-shadow .4s}
.cat .ic svg{width:34px;height:34px;stroke-width:1.5}
.cat:hover .ic{transform:rotate(-8deg) scale(1.08);background:var(--lime);color:#071003;box-shadow:0 0 40px -4px var(--lime-glow)}
.cat h3{font-size:1.08rem;font-weight:700}
.cat p{font-size:.78rem;color:var(--stone);line-height:1.6;max-width:18em}
.cat .bar{height:4px;width:100%;border-radius:4px;background:rgba(255,255,255,.07);margin-top:auto;overflow:hidden}
.cat .bar b{display:block;height:100%;background:var(--lime);border-radius:4px;box-shadow:0 0 10px var(--lime-glow);transition:width .9s var(--ease)}
.cat .st{width:100%;font-size:.72rem;color:var(--stone);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;margin-top:6px}
.chip{position:absolute;top:14px;inset-inline:0;margin:0 auto;width:max-content;font-size:.68rem;font-weight:600;border-radius:999px;padding:2px 11px;background:var(--lime);color:#071003;box-shadow:0 0 18px -2px var(--lime-glow)}
.chip.req{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(255,179,92,.35);box-shadow:none}
.cat.rec{border-color:rgba(166,240,74,.3)}
.cat.done .ic{background:var(--lime);color:#071003;box-shadow:0 0 30px -6px var(--lime-glow)}
.hubfoot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:32px;padding:22px 24px;border-radius:26px}

/* result */
.res-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding-block:36px}
.res-hero h1{font-size:clamp(1.8rem,4.4vw,2.9rem);font-weight:900;margin:12px 0 14px}
.planbadge{display:inline-flex;align-items:baseline;gap:10px;border-radius:14px;padding:8px 16px;font-family:var(--latin);font-weight:700;letter-spacing:.03em;color:var(--pc,var(--lime));border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent);box-shadow:0 0 30px -10px currentColor}
.planbadge small{font-family:var(--body);font-weight:400;opacity:.85;font-size:.78rem;color:var(--cocoa-2)}
.sachets{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.sachet{width:210px;max-width:46%;border-radius:14px;padding:18px 14px 20px;position:relative;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12);animation:drop 1s var(--ease) both}
.sachet:nth-child(2){animation-delay:.18s}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-8deg);filter:blur(6px)}}
.sachet::before,.sachet::after{content:"";position:absolute;inset-inline:0;height:7px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 3px,transparent 3px 7px)}
.sachet::before{top:0}.sachet::after{bottom:0}
.sachet .when{font-family:var(--display);font-weight:700;font-size:.88rem;display:flex;justify-content:space-between;align-items:center}
.sachet .when img{width:22px;height:22px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 10px;min-height:60px;align-content:center;justify-content:center}
.pill{width:30px;height:14px;border-radius:8px;box-shadow:inset -3px -2px 0 rgba(0,0,0,.2),0 0 12px -2px currentColor;animation:pillIn .7s var(--ease) both}
.pill.r{width:16px;height:16px;border-radius:50%}
@keyframes pillIn{from{opacity:0;transform:translateY(-16px) rotate(40deg) scale(.6)}}
.sachet ul{list-style:none;margin:0;padding:0;font-size:.77rem;color:var(--cocoa-2);line-height:1.75}
.sec{margin-top:40px}
.sec h2{font-size:1.35rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.sec h2 .n{font-family:var(--mono);font-size:.72rem;color:var(--stone);font-weight:500}
.profile{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pf{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pf small{display:block;color:var(--stone);font-size:.74rem}
.pf b{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.supps{display:grid;gap:10px}
.supp{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 16px;animation:enter .7s var(--ease) both;transition:border-color .3s,transform .3s var(--ease)}
.supp:hover{border-color:rgba(255,255,255,.2);transform:translateX(-3px)}
.supp .dot{width:14px;height:14px;border-radius:50%;margin-top:7px;box-shadow:0 0 14px currentColor}
.supp h3{font-size:1rem;font-weight:700;font-family:var(--body)}
.supp p{font-size:.84rem;color:var(--cocoa-2)}
.supp .t{font-size:.7rem;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--cocoa-2);white-space:nowrap;margin-top:4px}
.score{display:flex;gap:3px;margin-top:8px}
.score i{width:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.1)}
.score i.on{background:var(--lime);box-shadow:0 0 8px var(--lime-glow)}
.flag{display:flex;gap:12px;padding:12px 16px;border-radius:16px;background:var(--warn-soft);color:var(--cocoa);font-size:.9rem;margin-bottom:8px;border:1px solid rgba(255,179,92,.25);border-inline-start:3px solid var(--warn)}
.flag.bad{background:var(--bad-soft);border-color:rgba(255,107,107,.3);border-inline-start-color:var(--bad)}
.flag.note{background:var(--paper);border-color:var(--line);border-inline-start-color:var(--cyan)}
.ex{display:flex;flex-wrap:wrap;gap:8px}
.ex span{font-size:.82rem;border:1px dashed rgba(255,107,107,.5);color:var(--bad);border-radius:999px;padding:4px 12px;text-decoration:line-through;text-decoration-thickness:1px}
.ex span em{font-style:normal;display:inline-block;margin-inline-start:6px;color:var(--cocoa-2)}
.submitbox{margin-top:40px;padding:30px;border-radius:30px;border:1px solid var(--line-2);background:linear-gradient(160deg,rgba(166,240,74,.14),rgba(166,240,74,.02));box-shadow:0 0 80px -30px var(--lime-glow)}
.submitbox h2{font-size:1.45rem;margin-bottom:6px}
.submitbox p{color:var(--cocoa-2);font-size:.93rem}
.submitbox .ok{margin-top:12px;color:var(--lime);min-height:1.5em;font-size:.92rem}
.disc{font-size:.8rem;color:var(--stone);margin-top:22px}
.blocked{max-width:560px;margin:60px auto;text-align:center}

/* admin */
.adm table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
.adm th{font-weight:500;color:var(--stone);text-align:right;padding:12px;border-bottom:1px solid var(--line);font-size:.76rem}
.adm td{padding:13px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.adm tr.click{cursor:pointer;transition:background .2s}
.adm tr.click:hover{background:var(--paper)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.02)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:22px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat b{font-family:var(--latin);font-size:1.8rem;font-weight:700;display:block;line-height:1.2}
.stat small{color:var(--stone)}
.pillb{display:inline-block;font-size:.72rem;border-radius:999px;padding:1px 10px;font-family:var(--latin);border:1px solid currentColor}
.drawer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;justify-content:flex-start;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.drawer .pane{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg-2);border-inline-end:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));animation:slide .5s var(--ease) both}
@keyframes slide{from{transform:translateX(100%)}}
.qa{border-bottom:1px solid var(--line);padding:9px 0;font-size:.86rem}
.qa small{color:var(--stone);display:block}
.empty{padding:40px 20px;text-align:center;color:var(--stone)}

@media (max-width:900px){
  .hero,.res-hero{grid-template-columns:1fr;min-height:0;padding-top:30px}
  .orbit{max-width:400px}
  .plans,.lines{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr 1fr;row-gap:32px}
  .steps::before{display:none}
}
@media (max-width:520px){
  .grid2{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .qpanel{padding:22px 18px;border-radius:26px}
  .hud{font-size:.6rem;padding:5px 9px}
  .strip{gap:2px}
  .top .ghost{display:none}
  .cats{grid-template-columns:1fr 1fr;gap:10px}
  .cat{padding:34px 12px 12px;border-radius:22px}
  .cat .ic{width:54px;height:54px;border-radius:16px;margin-bottom:6px}
  .cat .ic svg{width:28px;height:28px}
  .cat p{display:none}
  .cat .chip{top:9px;font-size:.62rem}
  .kpis{gap:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* home button */
.homebtn{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 12px;font-family:var(--latin);font-weight:600;font-size:.82rem;letter-spacing:.06em;color:var(--cocoa);transition:border-color .3s,box-shadow .3s,background .3s}
.homebtn svg{width:16px;height:16px;color:var(--lime)}
.homebtn:hover{border-color:var(--line-2);box-shadow:0 0 22px -6px var(--lime-glow);background:var(--lime-soft)}
/* category selection */
.cat .tick{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;transition:all .35s var(--ease);background:rgba(0,0,0,.25)}
.cat .tick svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .35s var(--ease);color:#071003}
.cat.sel{border-color:var(--lime);box-shadow:0 0 0 1px rgba(166,240,74,.35),0 24px 60px -30px var(--lime-glow);background:linear-gradient(160deg,rgba(166,240,74,.14),rgba(166,240,74,.02))}
.cat.sel .tick{background:var(--lime);border-color:var(--lime);box-shadow:0 0 14px var(--lime-glow)}
.cat.sel .tick svg{opacity:1;transform:none}
.cat.sel .ic{background:var(--lime);color:#071003;box-shadow:0 0 30px -6px var(--lime-glow)}
.cat.locked{cursor:default}
.selcount{font-family:var(--latin);font-weight:700;color:var(--lime)}
/* sachet roll */
.roll{margin:0 auto 18px;max-width:740px;display:flex;align-items:center;gap:14px}
.roll .track{flex:1;position:relative;height:64px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%);mask-image:linear-gradient(90deg,transparent,#000 22%)}
.roll .row{position:absolute;inset:0 0 0 auto;display:flex;gap:0;align-items:center;direction:rtl}
.sc{width:40px;height:54px;flex:none;position:relative;border:1px solid rgba(255,255,255,.18);border-inline-start:none;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02));display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:6px 5px}
.sc:first-child{border-inline-start:1px solid rgba(255,255,255,.18);border-radius:0 6px 6px 0}
.sc::before,.sc::after{content:"";position:absolute;inset-inline:0;height:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 5px)}
.sc::before{top:0}.sc::after{bottom:0}
.sc i{width:12px;height:6px;border-radius:4px;box-shadow:0 0 8px -1px currentColor}
.sc i.r{width:8px;height:8px;border-radius:50%}
.sc.ghost{border-style:dashed;background:none;border-color:rgba(166,240,74,.35);border-inline-start:1px dashed rgba(166,240,74,.35);border-radius:6px 0 0 6px;animation:ghostPulse 1.6s ease-in-out infinite}
.sc.ghost::before,.sc.ghost::after{display:none}
@keyframes ghostPulse{50%{border-color:rgba(166,240,74,.75);box-shadow:0 0 18px -6px var(--lime-glow)}}
.sc.new{animation:scIn .7s var(--ease) both}
.sc.new i{animation:pillDrop .6s var(--ease) both}
.sc.new i:nth-child(2){animation-delay:.12s}.sc.new i:nth-child(3){animation-delay:.24s}
@keyframes scIn{from{transform:translateX(-30px) scaleX(.3);opacity:0}}
@keyframes pillDrop{from{transform:translateY(-26px) rotate(60deg);opacity:0}}
.roll .cnt{font-family:var(--mono);font-size:.72rem;color:var(--stone);white-space:nowrap;text-align:center;line-height:1.4}
.roll .cnt b{display:block;font-family:var(--latin);font-size:1.3rem;color:var(--lime)}
/* pack transition */
.packfx{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(166,240,74,.12),rgba(5,8,10,.96) 60%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .5s both}
.packfx.out{animation:pfOut .6s var(--ease) forwards}
@keyframes pfOut{to{opacity:0;transform:scale(1.15);filter:blur(8px)}}
.packfx .stage{position:relative;width:min(420px,90vw);height:380px;perspective:900px;display:grid;place-items:end center;padding-bottom:70px}
.packfx .box{position:relative;width:210px;height:150px;transform-style:preserve-3d;transform:rotateX(-8deg);animation:boxIn .7s var(--ease) both}
@keyframes boxIn{from{transform:translateY(80px) rotateX(-8deg);opacity:0}}
.packfx .front{position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,#B8F25E,#86C93A);box-shadow:0 30px 80px -20px var(--lime-glow),inset 0 -20px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#0b1a02;z-index:2}
.packfx .front img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.packfx .front b{font-family:var(--latin);letter-spacing:.25em;font-size:.95rem}
.packfx .front span{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;opacity:.75}
.packfx .front em{position:absolute;bottom:10px;left:10px;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(11,26,2,.5);display:grid;place-items:center;font-style:normal;font-family:var(--latin);font-weight:700;font-size:.8rem}
.packfx .lid{position:absolute;left:0;right:0;top:-1px;height:40px;background:linear-gradient(180deg,#9EDB4A,#7DBB33);border-radius:6px 6px 2px 2px;transform-origin:50% 0;transform:rotateX(150deg);animation:lidClose .55s 1.75s var(--ease) forwards;z-index:3}
@keyframes lidClose{to{transform:rotateX(0)}}
.packfx .box.glow .front{animation:boxGlow 1s ease-in-out}
@keyframes boxGlow{50%{box-shadow:0 0 120px 10px var(--lime-glow),inset 0 -20px 30px rgba(0,0,0,.12)}}
.packfx .fly{position:absolute;left:0;right:0;top:40px;display:flex;justify-content:center;gap:0;z-index:1}
.packfx .fly .sc{animation:intoBox .9s var(--ease) both}
@keyframes intoBox{0%{transform:translate(var(--fx),0) rotate(var(--fr));opacity:1}60%{transform:translate(0,120px) rotate(0) scale(.8);opacity:1}100%{transform:translate(0,190px) scale(.5);opacity:0}}
.packfx p{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--cocoa-2);font-size:.95rem}
.packfx p b{color:var(--lime)}
/* result toggles */
.supp{grid-template-columns:auto 1fr auto auto;align-items:center}
.supp.off{opacity:.45}
.supp.off h3{text-decoration:line-through;text-decoration-color:var(--stone)}
.sw{width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);position:relative;padding:0;flex:none;transition:background .3s,border-color .3s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--cocoa-2);transition:transform .35s var(--ease),background .3s}
.sw[aria-checked="true"]{background:var(--lime);border-color:var(--lime);box-shadow:0 0 16px -4px var(--lime-glow)}
.sw[aria-checked="true"]::after{transform:translateX(-20px);background:#071003}
.packsum{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:16px;border:1px solid var(--line-2);background:var(--lime-soft);margin-bottom:12px;font-size:.9rem}
.packsum b{font-family:var(--latin);color:var(--lime);font-size:1.1rem}
@media (max-width:520px){.homebtn span{display:none}.homebtn{padding:8px}.sc{width:32px;height:46px}.roll .track{height:56px}.supp{grid-template-columns:auto 1fr auto}.supp .t{display:none}}

/* 12 time of day */
:root{--tod:rgba(166,240,74,.14)}
:root.tod-m{--tod:rgba(242,209,75,.20)}
:root.tod-e{--tod:rgba(255,140,60,.16)}
:root.tod-n{--tod:rgba(124,140,255,.20)}
.aura{background:radial-gradient(600px circle at var(--mx) var(--my),rgba(166,240,74,.07),transparent 60%),radial-gradient(900px 600px at 85% -10%,var(--tod),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(124,140,255,.10),transparent 60%),var(--bg);transition:background 1s}
.greet{display:flex;align-items:center;gap:12px;margin-bottom:16px;animation:enter .9s .1s var(--ease) both}
.greet .gi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--tod);border:1px solid var(--line);color:var(--cocoa)}
.greet .gi svg{animation:spin 30s linear infinite}
:root.tod-n .greet .gi svg,:root.tod-e .greet .gi svg{animation:float 4s ease-in-out infinite}
.greet b{display:block;font-family:var(--display);font-size:1.05rem}
.greet small{color:var(--cocoa-2);font-size:.85rem}
/* 5 mascot */
#vita{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px;direction:ltr;pointer-events:none}
#vita .bod{width:74px;height:84px;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(166,240,74,.25));animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
#vita .bod.hop{animation:hop .6s var(--ease)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes hop{30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(.95,1.05)}}
#vita .bub{direction:rtl;max-width:220px;padding:10px 14px;border-radius:16px 16px 16px 4px;margin-left:30px;font-size:.84rem;line-height:1.6;pointer-events:auto;background:rgba(14,20,22,.92);border:1px solid var(--line-2);box-shadow:0 14px 40px -12px rgba(0,0,0,.8);transform-origin:0 100%;transition:opacity .35s,transform .45s var(--ease)}
#vita .bub.hide{opacity:0;transform:scale(.6) translateY(10px);pointer-events:none}
#vita .bub b{color:var(--lime);font-weight:700}
@media (max-width:520px){#vita .bod{width:54px;height:62px}#vita .bub{max-width:180px;font-size:.78rem}}
/* 8 badge */
.badgefx{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none}
.badgefx .card{text-align:center;padding:26px 30px;border-radius:28px;background:rgba(10,16,19,.9);border:1px solid var(--line-2);box-shadow:0 0 80px -20px var(--lime-glow),var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:bdgIn .6s var(--ease) both}
.badgefx.out .card{animation:bdgOut .45s var(--ease) forwards}
@keyframes bdgIn{from{opacity:0;transform:scale(.6) translateY(30px)}}
@keyframes bdgOut{to{opacity:0;transform:scale(.9) translateY(-30px)}}
.badgefx .ic{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:var(--lime);color:#071003;display:grid;place-items:center;box-shadow:0 0 50px -6px var(--lime-glow);animation:pop2 .8s .15s var(--ease) both}
.badgefx .ic svg{width:40px;height:40px}
@keyframes pop2{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.15) rotate(6deg)}}
.badgefx h3{font-size:1.25rem;font-weight:900}
.badgefx p{color:var(--cocoa-2);font-size:.9rem;margin-top:4px}
.badgefx .cf{position:absolute;left:50%;top:50%;width:18px;height:8px;border-radius:5px;animation:conf 1.4s var(--ease) both}
.badgefx .cf.r{width:10px;height:10px;border-radius:50%}
@keyframes conf{from{transform:translate(-50%,-50%) rotate(0);opacity:1}to{transform:translate(var(--tx),var(--ty)) rotate(var(--tr));opacity:0}}
/* 11 day timeline */
.day{margin-top:36px;border-radius:28px;padding:30px 26px}
.dbar{height:10px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden;direction:ltr}
.dbar i{display:block;height:100%;width:100%;border-radius:10px;background:linear-gradient(90deg,#2a3a7a,#F2D14B 28%,#A6F04A 52%,#FF8C3C 76%,#2a3a7a);transition:width 2.2s var(--ease) .3s}
.day.pre:not(.in) .dbar i{width:0}
.dstops{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;direction:ltr}

 const L=120*dpr;
 const tick=()=>{x.clearRect(0,0,W,H);
  for(let i=0;i<P.length;i++){const p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
   x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(${p.c},.7)`;x.fill();
   for(let j=i+1;j<P.length;j++){const q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);if(d<L){x.strokeStyle=`rgba(166,240,74,${(1-d/L)*.12})`;x.lineWidth=dpr*.6;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}}
  requestAnimationFrame(tick)};
 requestAnimationFrame(tick);
})();
addEventListener("pointerdown",e=>{const r=document.documentElement.style;r.setProperty("--vx",e.clientX+"px");r.setProperty("--vy",e.clientY+"px")},{capture:true});
document.getElementById("homeBtn").onclick=()=>go(()=>S.view="home");
document.getElementById("homeBtn2").onclick=()=>go(()=>S.view="home");
document.getElementById("adminBtn").onclick=()=>go(()=>S.view="admin");
const route=()=>{if(location.hash==="#admin"&&S.view!=="admin"){S.view="admin";render()}};
addEventListener("hashchange",route);
if(location.hash==="#admin")S.view="admin";
render();
})();
